[package]
name = "pollination"
version = "0.1.0"
readme = "../README.md"
edition = "2024"
authors = [
    "Byron Wasti <dev@byronwasti.com>"
]
categories = ["data-structures"]
keywords = ["raft", "crdt", "gossip", "distributed"]
description = "An experimental library exposing hybrid Raft and CRDT primitives."
homepage = "https://github.com/byronwasti/florescence"
license = "MIT OR Apache-2.0"
repository = "https://github.com/byronwasti/florescence"

[dependencies]
serde = { version = "1.0.218", features = ["derive"], optional = true }
simplehash = "0.1.3"
thiserror = "2.0.12"
tracing = "0.1.41"
treeclocks = { version = "0.7.2", features = ["serde"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }

[dev-dependencies]
clap = { version = "4.5.35", features = ["derive"] }
insta = "1.43.1"
rand = "0.10.2"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
serde_json = { version = "1.0.140" }
serde_path_to_error = { version = "0.1.17" }

[build-dependencies]

[features]
default=["serde"]
serde=["dep:serde"]
