[package]
name = "pollination-viewer"
version = "0.1.0"
authors = ["Byron Wasti <github@byronwasti.com>"]
edition = "2024"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.95"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = "0.36"
eframe = { version = "0.36", features = ["persistence"] }
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }

petgraph = { version = "0.8.2", features = ["serde-1"] }
rand = "0.10.2"
fjadra = "0.2.1"
pollination = { path = "../pollination-core" }
pollination-simulation = { path = "../pollination-simulation" }
pollination-simulator = { path = "../pollination-simulator" }
uuid = { version = "1.26.0", features = [ "rng-rand" ] }
anyhow = "1.0.100"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
egui_plot = "0.37.0"
serde_json = "1.0.151"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"              # to access the DOM (to hide the loading text)

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2


# If you want to use the bleeding edge version of egui and eframe:
# egui = { git = "https://github.com/emilk/egui", branch = "main" }
# eframe = { git = "https://github.com/emilk/egui", branch = "main" }

# If you fork https://github.com/emilk/egui you can test with:
# egui = { path = "../egui/crates/egui" }
# eframe = { path = "../egui/crates/eframe" }

[lints]
workspace = true
